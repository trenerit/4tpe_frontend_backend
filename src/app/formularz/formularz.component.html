<form #loginForm="ngForm" (ngSubmit)="submitLoginForm(loginForm)">
    @if(!mailError) {
        <label for="email">Podaj adres e-mail</label>
    } @else {
        <label class="error" for="email">Uzupełnij adres email</label>
    }
    
    <input type="email" name="email" id="email" ngModel required>
    
    @if(!passError) {
        <label for="pass">Podaj hasło</label>
    } @else {
        <label class="error" for="pass">Uzupełnij hasło</label>
    }
    
    <input type="password" name="pass" id="pass" ngModel required>
    
    <!-- <button type="submit" [disabled]="loginForm.invalid">Logowanie</button> -->
    <button type="submit">Logowanie</button>
</form>

{{loginForm.invalid}}
